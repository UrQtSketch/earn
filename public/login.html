<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — EarnRadar</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 170px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-box {
      width: min(440px, 100%);
      padding: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, rgba(16,23,34,0.92), rgba(6,9,14,0.92));
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header h1 {
      font: 700 26px var(--font-heading);
      margin-top: 8px;
    }
    .auth-header p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="grid-bg"></div>

  <header class="topbar"></header>

  <main class="container auth-wrapper">
    <div class="auth-box">
      <div class="auth-header">
        <div class="eyebrow" style="justify-content: center;"><i></i> WELCOME BACK</div>
        <h1>Sign in to EarnRadar</h1>
        <p>Access your dashboard, verified methods, and collaborations.</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="input" placeholder="name@domain.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <div class="form-label">
            <span>Password</span>
            <a href="/forgot-password" style="font-size: 11px; color: var(--cyan);">Forgot password?</a>
          </div>
          <input type="password" id="password" class="input" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="submit-btn" class="btn primary" style="width: 100%; margin-top: 10px;">
          Sign In <b>→</b>
        </button>

        <div style="text-align: center; margin-top: 24px; font-size: 12px; color: var(--muted);">
          Don't have an account? <a href="/signup" style="color: var(--cyan); font-weight: 700;">Sign up free</a>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <div class="footer-logo"><span class="logo-mark">↗</span><b>EarnRadar</b></div>
    <span>© 2026 EarnRadar</span>
  </footer>

  <script type="module">
    import { API } from '/js/api.js';
    import { initNavbar, showToast } from '/js/ui.js';

    await initNavbar('/login');

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Signing in...';

      try {
        const res = await API.login(email, password);
        if (res.success) {
          showToast(`Welcome back, ${res.user.profile?.fullName || 'User'}!`, 'success');
          setTimeout(() => {
            if (res.user.role === 'ADMIN') {
              window.location.href = '/admin';
            } else {
              window.location.href = '/dashboard';
            }
          }, 600);
        } else {
          showToast(res.error || 'Invalid credentials.', 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Sign In <b>→</b>';
        }
      } catch (err) {
        showToast(err.message || 'Login failed.', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In <b>→</b>';
      }
    });
  </script>
</body>
</html>
