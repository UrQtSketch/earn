services:
  - type: web
    name: earnradar
    env: node
    plan: free
    buildCommand: npm install && npm run build && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
      - key: SESSION_EXPIRES_IN
        value: 7d
      - key: OTP_EXPIRY_MINUTES
        value: 10
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: 60
      - key: OTP_MAX_ATTEMPTS
        value: 5
