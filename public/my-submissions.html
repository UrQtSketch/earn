<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Submissions — EarnRadar</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="grid-bg"></div>

  <header class="topbar"></header>

  <main class="container" style="padding: 40px 0 80px;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; border-bottom: 1px solid var(--line); padding-bottom: 24px;">
      <div>
        <div class="eyebrow"><i></i> SUBMISSION LIFECYCLE</div>
        <h1 style="font: 700 clamp(28px, 3.5vw, 42px) var(--font-heading);">
          My Shared Methods
        </h1>
        <p style="color: var(--muted); font-size: 13px; margin-top: 6px;">
          Track moderation status, view feedback, and revise your submissions.
        </p>
      </div>

      <a class="btn primary" href="/share-method">+ Share Another Method</a>
    </div>

    <div id="submissions-list" style="display: grid; gap: 16px;">
      <div style="padding: 40px; text-align: center; color: var(--muted);">Loading your submissions...</div>
    </div>
  </main>

  <footer>
    <div class="footer-logo"><span class="logo-mark">↗</span><b>EarnRadar</b></div>
    <span>© 2026 EarnRadar</span>
  </footer>

  <script type="module">
    import { API } from '/js/api.js';
    import { initNavbar, showToast, escapeHtml, formatTimeAgo } from '/js/ui.js';

    await initNavbar('/my-submissions');

    async function loadMySubmissions() {
      const container = document.getElementById('submissions-list');
      try {
        const res = await API.getMySubmissions();
        if (res.success && res.submissions.length > 0) {
          container.innerHTML = res.submissions.map(sub => {
            const statusClass = sub.status.toLowerCase();
            return `
              <div class="card" style="padding: 24px;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px;">
                  <div>
                    <span class="status-pill ${statusClass}">${sub.status}</span>
                    <span style="font-size: 11px; color: var(--muted); margin-left: 8px;">Submitted ${formatTimeAgo(sub.submittedAt || sub.createdAt)}</span>
                  </div>
                  <span style="font-size: 11px; color: var(--cyan); font-weight: 700;">${escapeHtml(sub.categoryName || 'General')}</span>
                </div>

                <h3 style="font: 700 18px var(--font-heading); margin-bottom: 8px;">${escapeHtml(sub.title)}</h3>
                <p style="color: var(--muted); font-size: 13px; line-height: 1.6; margin-bottom: 16px;">${escapeHtml(sub.summary || 'Method details submitted for verification.')}</p>

                ${sub.status === 'CHANGES_REQUESTED' ? `
                  <div class="warning" style="margin-bottom: 16px;">
                    <b>Admin Reviewer Feedback:</b>
                    <p>${escapeHtml(sub.adminFeedback || 'Please provide additional official source links and clarify step 3.')}</p>
                  </div>
                ` : ''}

                ${sub.status === 'PUBLISHED' ? `
                  <div style="padding: 10px 14px; border-radius: 10px; background: rgba(125,255,178,0.06); border: 1px solid rgba(125,255,178,0.2); font-size: 12px; color: var(--green); margin-bottom: 14px;">
                    ✓ Published live on the community radar.
                  </div>
                ` : ''}

                <div style="display: flex; gap: 10px;">
                  <a class="btn secondary sm" href="/share-method">Edit / Resubmit</a>
                </div>
              </div>
            `;
          }).join('');
        } else {
          container.innerHTML = `
            <div class="card" style="padding: 40px; text-align: center;">
              <h3 style="font: 700 18px var(--font-heading); margin-bottom: 8px;">No methods shared yet</h3>
              <p style="color: var(--muted); font-size: 13px; margin-bottom: 20px;">Found a legitimate earning method? Help the community by sharing the complete breakdown.</p>
              <a class="btn primary sm" href="/share-method">+ Share a Method</a>
            </div>
          `;
        }
      } catch (err) {
        console.error(err);
        container.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--red);">Failed to load submissions.</div>';
      }
    }

    loadMySubmissions();
  </script>
</body>
</html>
