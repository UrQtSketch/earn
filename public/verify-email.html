<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — EarnRadar</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 170px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-box {
      width: min(480px, 100%);
      padding: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, rgba(16,23,34,0.92), rgba(6,9,14,0.92));
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="grid-bg"></div>

  <header class="topbar"></header>

  <main class="container auth-wrapper">
    <div class="auth-box">
      <div class="eyebrow" style="justify-content: center;"><i></i> EMAIL VERIFICATION</div>
      <h1 style="font: 700 26px var(--font-heading); margin-top: 8px;">Check your email</h1>
      <p style="color: var(--muted); font-size: 13px; margin: 10px 0 24px;">
        We sent a 6-digit verification code to<br>
        <b id="target-email-display" style="color: var(--cyan);">your email</b>
      </p>

      <form id="otp-form">
        <div class="otp-container">
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric" autocomplete="one-time-code" autofocus>
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric">
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric">
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric">
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric">
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric">
        </div>

        <div id="dev-otp-helper" style="display: none; padding: 8px; margin-bottom: 16px; border-radius: 8px; background: rgba(125,255,178,0.06); border: 1px solid rgba(125,255,178,0.2); font-size: 11px; color: var(--green);">
          Dev Helper OTP: <b id="dev-otp-code">------</b> <button type="button" id="auto-fill-btn" style="background:transparent; border:none; color:var(--cyan); cursor:pointer; text-decoration:underline; font-weight:bold; margin-left:6px;">Auto Fill</button>
        </div>

        <button type="submit" id="verify-btn" class="btn primary" style="width: 100%; margin-top: 10px;">
          Verify &amp; Create Account <b>✓</b>
        </button>

        <div style="margin-top: 24px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center;">
          <span>Didn't receive code?</span>
          <button type="button" id="resend-btn" class="btn secondary sm" disabled>
            Resend in <span id="timer-sec">60</span>s
          </button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <div class="footer-logo"><span class="logo-mark">↗</span><b>EarnRadar</b></div>
    <span>© 2026 EarnRadar</span>
  </footer>

  <script type="module">
    import { API } from '/js/api.js';
    import { initNavbar, showToast } from '/js/ui.js';

    await initNavbar('/verify-email');

    const params = new URLSearchParams(window.location.search);
    const email = params.get('email') || '';
    const purpose = params.get('purpose') || 'SIGNUP';

    const emailDisplay = document.getElementById('target-email-display');
    emailDisplay.textContent = email || 'your email';

    // Pending registration payload
    let pendingSignup = null;
    try {
      pendingSignup = JSON.parse(sessionStorage.getItem('earnradar_pending_signup') || 'null');
    } catch (_) {}

    // OTP Inputs setup
    const otpBoxes = Array.from(document.querySelectorAll('.otp-box'));
    otpBoxes.forEach((box, index) => {
      box.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val;
        if (val && index < otpBoxes.length - 1) {
          otpBoxes[index + 1].focus();
        }
      });

      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !box.value && index > 0) {
          otpBoxes[index - 1].focus();
        }
      });

      box.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
        if (pasted) {
          pasted.split('').forEach((char, i) => {
            if (otpBoxes[i]) otpBoxes[i].value = char;
          });
          if (otpBoxes[pasted.length - 1]) otpBoxes[pasted.length - 1].focus();
        }
      });
    });

    // Check dev outbox for quick auto-fill helper in development
    try {
      const outboxRes = await API.getDevOutbox();
      if (outboxRes.success && outboxRes.emails && outboxRes.emails.length > 0) {
        const latest = outboxRes.emails.find(m => m.to.toLowerCase() === email.toLowerCase());
        if (latest && latest.otp) {
          const devHelper = document.getElementById('dev-otp-helper');
          devHelper.style.display = 'block';
          document.getElementById('dev-otp-code').textContent = latest.otp;
          document.getElementById('auto-fill-btn').addEventListener('click', () => {
            latest.otp.split('').forEach((digit, i) => {
              if (otpBoxes[i]) otpBoxes[i].value = digit;
            });
            otpBoxes[5].focus();
          });
        }
      }
    } catch (_) {}

    // Resend Timer Cooldown
    let cooldown = 60;
    const resendBtn = document.getElementById('resend-btn');
    const timerSec = document.getElementById('timer-sec');

    const interval = setInterval(() => {
      cooldown--;
      if (cooldown <= 0) {
        clearInterval(interval);
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend Code';
      } else {
        timerSec.textContent = cooldown;
      }
    }, 1000);

    resendBtn.addEventListener('click', async () => {
      try {
        resendBtn.disabled = true;
        const res = await API.requestOTP(email, purpose);
        if (res.success) {
          showToast('New verification code sent!', 'success');
          cooldown = 60;
          resendBtn.innerHTML = `Resend in <span id="timer-sec">60</span>s`;
        } else {
          showToast(res.error || 'Failed to resend.', 'error');
          resendBtn.disabled = false;
        }
      } catch (err) {
        showToast(err.message, 'error');
        resendBtn.disabled = false;
      }
    });

    // Submit Verification
    const form = document.getElementById('otp-form');
    const verifyBtn = document.getElementById('verify-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const enteredOtp = otpBoxes.map(b => b.value).join('');

      if (enteredOtp.length !== 6) {
        showToast('Please enter all 6 digits of the code.', 'error');
        return;
      }

      verifyBtn.disabled = true;
      verifyBtn.innerHTML = 'Verifying...';

      try {
        if (purpose === 'SIGNUP') {
          if (!pendingSignup) {
            showToast('Signup session expired. Please sign up again.', 'error');
            setTimeout(() => window.location.href = '/signup', 1000);
            return;
          }

          const regRes = await API.register({
            ...pendingSignup,
            otp: enteredOtp
          });

          if (regRes.success) {
            sessionStorage.removeItem('earnradar_pending_signup');
            showToast('Account verified and created successfully!', 'success');
            setTimeout(() => {
              window.location.href = '/onboarding';
            }, 800);
          } else {
            showToast(regRes.error || 'Verification failed.', 'error');
            verifyBtn.disabled = false;
            verifyBtn.innerHTML = 'Verify &amp; Create Account <b>✓</b>';
          }
        }
      } catch (err) {
        showToast(err.message || 'Error occurred.', 'error');
        verifyBtn.disabled = false;
        verifyBtn.innerHTML = 'Verify &amp; Create Account <b>✓</b>';
      }
    });
  </script>
</body>
</html>
