<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management — EarnRadar Admin</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="grid-bg"></div>

  <header class="topbar"></header>

  <main class="container" style="padding: 40px 0 80px;">
    <div class="admin-header">
      <div>
        <div class="eyebrow"><i></i> MEMBERSHIP CONTROL</div>
        <h1 style="font: 700 clamp(28px, 3.5vw, 40px) var(--font-heading);">User Accounts Management</h1>
      </div>
    </div>

    <!-- Admin Navigation Bar -->
    <div class="admin-nav">
      <a href="/admin" class="admin-nav-link">📊 Overview</a>
      <a href="/admin/submissions" class="admin-nav-link">📝 Submissions Moderation</a>
      <a href="/admin/claims" class="admin-nav-link">💰 Earning Claims Review</a>
      <a href="/admin/users" class="admin-nav-link active">👥 User Management</a>
      <a href="/admin/reports" class="admin-nav-link">🚨 Reports Queue</a>
      <a href="/admin/analytics" class="admin-nav-link">📈 Analytics</a>
      <a href="/admin/audit-log" class="admin-nav-link">📜 Audit Log</a>
    </div>

    <!-- Search & Filter Controls -->
    <div class="card" style="padding: 16px; margin-bottom: 24px;">
      <div style="display: flex; gap: 14px;">
        <input type="text" id="user-search" class="input" placeholder="Search by name, email, or username...">
        <select id="user-status-filter" class="select" style="width: 160px;">
          <option value="">All Statuses</option>
          <option value="ACTIVE">ACTIVE</option>
          <option value="SUSPENDED">SUSPENDED</option>
          <option value="BANNED">BANNED</option>
        </select>
      </div>
    </div>

    <div class="data-table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>User</th>
            <th>Email</th>
            <th>Role</th>
            <th>Activity</th>
            <th>Status</th>
            <th style="text-align: right;">Action</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--muted);">Loading users...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>
    <div class="footer-logo"><span class="logo-mark">↗</span><b>EarnRadar</b></div>
    <span>© 2026 EarnRadar</span>
  </footer>

  <script type="module">
    import { API } from '/js/api.js';
    import { initNavbar, showToast, escapeHtml } from '/js/ui.js';

    await initNavbar('/admin/users');

    async function loadUsers() {
      const search = document.getElementById('user-search').value.trim();
      const status = document.getElementById('user-status-filter').value;
      const tbody = document.getElementById('users-tbody');

      try {
        const res = await API.getAdminUsers({ search, status });
        if (res.success && res.users?.length > 0) {
          tbody.innerHTML = res.users.map(u => `
            <tr>
              <td>
                <b>${escapeHtml(u.profile?.fullName || 'User')}</b>
                <div style="font-size: 10px; color: var(--cyan);">@${escapeHtml(u.profile?.username || 'user')}</div>
              </td>
              <td>${escapeHtml(u.email)}</td>
              <td><span style="font-weight: 700; font-size: 11px;">${u.role}</span></td>
              <td style="font-size: 11px; color: var(--muted);">
                ${u.counts?.submissions || 0} subs • ${u.counts?.memberships || 0} joined
              </td>
              <td><span class="status-pill ${u.status.toLowerCase()}">${u.status}</span></td>
              <td style="text-align: right;">
                ${u.status === 'ACTIVE' ? `
                  <button class="btn secondary sm toggle-status-btn" data-id="${u.id}" data-status="SUSPENDED" style="color: var(--yellow);">Suspend</button>
                  <button class="btn danger sm toggle-status-btn" data-id="${u.id}" data-status="BANNED">Ban</button>
                ` : `
                  <button class="btn primary sm toggle-status-btn" data-id="${u.id}" data-status="ACTIVE">Reactivate</button>
                `}
              </td>
            </tr>
          `).join('');

          document.querySelectorAll('.toggle-status-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
              const id = btn.getAttribute('data-id');
              const newStatus = btn.getAttribute('data-status');
              const res = await API.updateAdminUserStatus(id, { status: newStatus });
              if (res.success) {
                showToast(res.message, 'success');
                loadUsers();
              } else {
                showToast(res.error || 'Failed to update user.', 'error');
              }
            });
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--muted);">No users found.</td></tr>';
        }
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById('user-search').addEventListener('input', () => {
      clearTimeout(window._userSearchTimer);
      window._userSearchTimer = setTimeout(loadUsers, 300);
    });

    document.getElementById('user-status-filter').addEventListener('change', loadUsers);

    loadUsers();
  </script>
</body>
</html>
