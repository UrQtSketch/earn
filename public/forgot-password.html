<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — EarnRadar</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 170px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-box {
      width: min(440px, 100%);
      padding: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, rgba(16,23,34,0.92), rgba(6,9,14,0.92));
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header h1 {
      font: 700 26px var(--font-heading);
      margin-top: 8px;
    }
    .auth-header p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="grid-bg"></div>

  <header class="topbar"></header>

  <main class="container auth-wrapper">
    <div class="auth-box">
      <div class="auth-header">
        <div class="eyebrow" style="justify-content: center;"><i></i> ACCOUNT RECOVERY</div>
        <h1>Reset your password</h1>
        <p>Enter your email to receive a 6-digit recovery code.</p>
      </div>

      <!-- Step 1: Request OTP -->
      <form id="request-otp-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="reset-email" class="input" placeholder="name@domain.com" required>
        </div>

        <button type="submit" id="request-btn" class="btn primary" style="width: 100%; margin-top: 10px;">
          Send Recovery Code <b>→</b>
        </button>
      </form>

      <!-- Step 2: Enter OTP & New Password -->
      <form id="reset-pass-form" style="display: none; margin-top: 10px;">
        <div class="form-group">
          <label class="form-label">6-Digit Verification Code</label>
          <input type="text" id="reset-otp" class="input" placeholder="123456" maxlength="6" style="letter-spacing: 4px; font-weight: 700; font-family: monospace;" required>
        </div>

        <div class="form-group">
          <label class="form-label">New Password <small>(min. 8 characters)</small></label>
          <input type="password" id="new-password" class="input" placeholder="••••••••••••" required>
        </div>

        <button type="submit" id="reset-btn" class="btn primary" style="width: 100%; margin-top: 10px;">
          Set New Password <b>✓</b>
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 12px; color: var(--muted);">
        Remember your password? <a href="/login" style="color: var(--cyan); font-weight: 700;">Back to login</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-logo"><span class="logo-mark">↗</span><b>EarnRadar</b></div>
    <span>© 2026 EarnRadar</span>
  </footer>

  <script type="module">
    import { API } from '/js/api.js';
    import { initNavbar, showToast } from '/js/ui.js';

    await initNavbar('/forgot-password');

    let targetEmail = '';
    const reqForm = document.getElementById('request-otp-form');
    const resetForm = document.getElementById('reset-pass-form');
    const reqBtn = document.getElementById('request-btn');
    const resetBtn = document.getElementById('reset-btn');

    reqForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      targetEmail = document.getElementById('reset-email').value.trim();

      reqBtn.disabled = true;
      reqBtn.innerHTML = 'Sending code...';

      try {
        const res = await API.requestOTP(targetEmail, 'RESET_PASSWORD');
        if (res.success) {
          showToast('Verification code sent to your email!', 'success');
          reqForm.style.display = 'none';
          resetForm.style.display = 'block';
        } else {
          showToast(res.error || 'Failed to send code.', 'error');
          reqBtn.disabled = false;
          reqBtn.innerHTML = 'Send Recovery Code <b>→</b>';
        }
      } catch (err) {
        showToast(err.message, 'error');
        reqBtn.disabled = false;
        reqBtn.innerHTML = 'Send Recovery Code <b>→</b>';
      }
    });

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const otp = document.getElementById('reset-otp').value.trim();
      const newPassword = document.getElementById('new-password').value;

      resetBtn.disabled = true;
      resetBtn.innerHTML = 'Updating password...';

      try {
        const res = await API.resetPassword(targetEmail, otp, newPassword);
        if (res.success) {
          showToast('Password reset successful! You can now log in.', 'success');
          setTimeout(() => {
            window.location.href = '/login';
          }, 800);
        } else {
          showToast(res.error || 'Failed to reset password.', 'error');
          resetBtn.disabled = false;
          resetBtn.innerHTML = 'Set New Password <b>✓</b>';
        }
      } catch (err) {
        showToast(err.message, 'error');
        resetBtn.disabled = false;
        resetBtn.innerHTML = 'Set New Password <b>✓</b>';
      }
    });
  </script>
</body>
</html>
